openapi: 3.2.0
info:
  title: Amazon Inspector Scanning API
  description: The Amazon Inspector API enables programmatic management of the automated vulnerability management service. You can enable and disable scanning, list and describe findings, manage filters, configure coverage, and retrieve vulnerability intelligence for EC2 instances, container images, and Lambda functions.
  version: '2020-06-08'
  contact:
    name: AWS Support
    url: https://aws.amazon.com/premiumsupport/
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html
  x-logo:
    url: https://a0.awsstatic.com/libra-css/images/logos/aws_logo_smile_1200x630.png
servers:
- url: https://inspector2.{region}.amazonaws.com
  description: Amazon Inspector regional endpoint
  variables:
    region:
      default: us-east-1
      description: AWS region
      enum:
      - us-east-1
      - us-east-2
      - us-west-1
      - us-west-2
      - eu-west-1
      - eu-west-2
      - eu-west-3
      - eu-central-1
      - ap-northeast-1
      - ap-northeast-2
      - ap-southeast-1
      - ap-southeast-2
      - ap-south-1
      - sa-east-1
      - ca-central-1
security:
- sigv4: []
tags:
- name: Scanning
  description: Operations for enabling and managing vulnerability scanning
paths:
  /enable:
    post:
      operationId: Enable
      summary: Enable Amazon Inspector scanning
      description: Enables Amazon Inspector scanning for one or more resource types in one or more accounts.
      tags:
      - Scanning
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - resourceTypes
              properties:
                accountIds:
                  type: array
                  items:
                    type: string
                resourceTypes:
                  type: array
                  items:
                    type: string
                    enum:
                    - EC2
                    - ECR
                    - LAMBDA
                    - LAMBDA_CODE
      responses:
        '200':
          description: Scanning enabled successfully
        '400':
          description: Bad request
        '403':
          description: Access denied
  /disable:
    post:
      operationId: Disable
      summary: Disable Amazon Inspector scanning
      description: Disables Amazon Inspector scanning for one or more resource types in one or more accounts.
      tags:
      - Scanning
      responses:
        '200':
          description: Scanning disabled successfully
components:
  securitySchemes:
    sigv4:
      type: apiKey
      name: Authorization
      in: header
      description: AWS Signature Version 4 authentication
